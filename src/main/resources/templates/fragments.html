<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Utility Fragments</title>

  <th:block th:fragment="style">
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" />
    <link th:rel="stylesheet" th:href="@{/css/style.css}" />
  </th:block>

</head>

<body>

  <nav th:fragment="navbar" class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Best of years by ...</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/movie">Movie</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/song">Song</a>
          </li>
        </ul>
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>



  <th:block th:fragment="songListGroup(songList)">
    <ul class="list-group" th:each=" song : ${songList}">
      <!-- <li class="list-group-item" th:text="|N° ${song.id} ${song.title} - ${song.artist}|" /> -->
      <li class="list-group-item">
        <a class="" th:href="|song/${song.id}|" th:text="|N° ${song.id} ${song.title} - ${song.artist}|" />
      </li>
    </ul>
  </th:block>

  <th:block th:fragment="movieListGroup(movieList)">
    <ul class="list-group" th:each="movie : ${movieList}">
      <li class="list-group-item">
        <a class="" th:href="|movie/${movie.id}|" th:text="|N° ${movie.id} ${movie.title} - ${movie.director}|" />
      </li>
    </ul>
  </th:block>

</body>

<th:block th:fragment="script">
  <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.min.js}"></script>
</th:block>

</html>
